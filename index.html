    <!-- Fonts: Fraunces (display serif, restricted weights) + Inter (body sans).
         Async-load via preload-then-swap to remove the only render-blocking resource. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,300&family=Inter:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,300&family=Inter:wght@400;500;600&display=swap" />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:title" content="Haven Creek Renovations — One trusted contractor for the property you value." />

    <meta property="og:url" content="https://havencreekrenovations.ca/" />
    <meta property="og:site_name" content="Haven Creek Renovations" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Haven Creek Renovations — Trusted renovations for rural homes" />
